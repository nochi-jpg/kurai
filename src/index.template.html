<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くらいタワー</title>
<style>
:root{
  --bg:#f3efe4; --panel:#fffdf7; --ink:#3a3530; --sub:#7a7268; --line:#d9d1c0;
  --c1:#f6a04d; --c10:#5bb98c; --c100:#5d9cec; --c1000:#b07cf0;
  --btn:#4f7fd6; --btn2:#8a9bb5; --ok:#3fae6a; --ng:#e05a5a; --gold:#f2c14e;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"Yu Gothic","Meiryo","Hiragino Sans",sans-serif;color:var(--ink)}
#viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:960px;height:600px;background:var(--bg);transform-origin:center center;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;color:#fff;background:var(--btn);
  font-size:20px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .06s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
button:disabled{opacity:.35;cursor:default;transform:none}
button.sec{background:var(--btn2)}
button.big{width:260px;height:64px;font-size:26px}
button.mid{width:200px;height:56px;font-size:22px}
.btn-row{display:flex;justify-content:center;gap:16px}

/* ---- title ---- */
#s-title .logo{position:absolute;top:70px;left:0;width:960px;text-align:center}
#s-title .logo h1{font-size:72px;letter-spacing:6px;color:var(--ink);text-shadow:4px 4px 0 #e2d6bb}
#s-title .logo p{font-size:20px;color:var(--sub);margin-top:8px}
#s-title .btn-row{position:absolute;top:360px;left:0;width:960px;flex-direction:column;align-items:center;gap:16px}
#title-towers{position:absolute;top:190px;left:0;width:960px;height:150px;display:flex;justify-content:center;align-items:flex-end;gap:20px}
#title-towers .tb{border-radius:6px;height:22px;margin-top:4px}
#se-btn{position:absolute;right:20px;top:20px;width:140px;height:44px;font-size:18px}
#ver{position:absolute;left:20px;bottom:14px;font-size:14px;color:var(--sub)}

/* ---- select ---- */
.hdr{position:absolute;top:0;left:0;width:960px;height:64px;display:flex;align-items:center;justify-content:center;
  background:var(--panel);border-bottom:2px solid var(--line)}
.hdr h2{font-size:28px}
.hdr .back{position:absolute;left:16px;top:10px;width:120px;height:44px;font-size:18px}
.hdr .right{position:absolute;right:16px;top:10px;width:120px;height:44px;font-size:18px}
#stage-grid{position:absolute;top:84px;left:0;width:960px;display:flex;flex-direction:column;gap:18px;align-items:center}
.grid-row{display:flex;gap:16px;justify-content:center}
.sec-label{width:900px;font-size:18px;color:var(--sub);font-weight:700;padding-left:6px}
.card{width:210px;height:150px;background:var(--panel);border:2px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 4px 0 #e2d6bb}
.card:hover{border-color:var(--btn)}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 #e2d6bb}
.card .grade{font-size:15px;color:var(--sub);font-weight:700}
.card .name{font-size:24px;font-weight:700}
.card .range{font-size:16px;color:var(--sub)}
.card .stars{font-size:18px;color:var(--gold);letter-spacing:2px;height:24px}
.card .best{font-size:14px;color:var(--sub)}

/* ---- game ---- */
#g-hdr{position:absolute;top:0;left:0;width:960px;height:64px;background:var(--panel);border-bottom:2px solid var(--line);display:flex;align-items:center}
#g-stage{width:200px;padding-left:20px;font-size:18px;font-weight:700;color:var(--sub)}
#g-task{flex:1;text-align:center;font-size:30px;font-weight:700;white-space:nowrap}
#g-task b{font-size:40px;color:var(--btn);margin:0 6px}
#g-timer,#g-score{width:130px;height:44px;margin-right:10px;border-radius:10px;background:var(--bg);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
#g-timer.warn{color:var(--ng);border-color:var(--ng)}
#g-prog{position:absolute;top:72px;left:20px;font-size:16px;color:var(--sub);font-weight:700}
#g-now{position:absolute;top:72px;right:20px;font-size:16px;color:var(--sub);font-weight:700}
#towers{position:absolute;top:100px;left:0;width:960px;height:410px;display:flex;justify-content:center;gap:24px}
.col{width:190px;height:410px;display:flex;flex-direction:column;align-items:center}
.col .digit{width:60px;height:48px;border-radius:10px;background:var(--panel);border:2px solid var(--line);
  font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
.col .stack{width:190px;height:310px;display:flex;flex-direction:column-reverse;align-items:center;gap:4px;padding-bottom:4px;
  border-bottom:6px solid #c9bda4;margin-top:6px}
.col .label{height:36px;line-height:36px;font-size:18px;font-weight:700;color:var(--sub)}
.blk{height:26px;border-radius:5px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.blk.u1{width:36px;background:var(--c1)}
.blk.u10{width:80px;background:repeating-linear-gradient(90deg,var(--c10) 0 7px,rgba(255,255,255,.45) 7px 8px)}
.blk.u100{width:120px;background:repeating-linear-gradient(90deg,var(--c100) 0 11px,rgba(255,255,255,.45) 11px 12px)}
.blk.u1000{width:150px;background:var(--c1000);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),inset 0 0 0 3px rgba(255,255,255,.35)}
.col.bundle .blk{animation:bund .35s ease-in forwards}
@keyframes bund{0%{opacity:1}60%{opacity:1;transform:scaleX(1.1)}100%{opacity:0;transform:scale(.3)}}
.blk.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:.3}100%{transform:scale(1);opacity:1}}
#towers.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
#g-btns{position:absolute;bottom:0;left:0;width:960px;height:84px;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--panel);border-top:2px solid var(--line)}
#g-btns button{width:120px;height:56px;font-size:19px}
#g-btns button.u1{background:var(--c1)} #g-btns button.u10{background:var(--c10)}
#g-btns button.u100{background:var(--c100)} #g-btns button.u1000{background:var(--c1000)}
#g-btns button.done{background:var(--ok);width:150px}
#g-choices{position:absolute;bottom:0;left:0;width:960px;height:84px;display:none;align-items:center;justify-content:center;gap:12px;
  background:var(--panel);border-top:2px solid var(--line)}
#g-choices button{width:200px;height:56px;font-size:26px}
#g-choices button.right{background:var(--ok)} #g-choices button.wrong{background:var(--ng)}
#g-fb{position:absolute;top:240px;left:0;width:960px;text-align:center;font-size:64px;font-weight:700;pointer-events:none;
  opacity:0;transition:opacity .15s;text-shadow:0 0 12px #fff,0 0 12px #fff}
#g-fb.ok{color:var(--ok);opacity:1} #g-fb.ng{color:var(--ng);opacity:1}

/* ---- scale mode ---- */
#scale-area{position:absolute;top:100px;left:0;width:960px;height:410px;display:none;flex-direction:column;align-items:center}
#scale-info{height:40px;line-height:40px;font-size:22px;font-weight:700;color:var(--sub)}
#scale-svg{width:900px;height:200px;background:var(--panel);border:2px solid var(--line);border-radius:14px}
#scale-btns{display:flex;gap:16px;margin-top:22px}
#scale-btns button{width:200px;height:56px;font-size:22px}
#scale-hint{height:40px;line-height:40px;font-size:18px;color:var(--sub);margin-top:10px}

/* ---- result ---- */
#res-box{position:absolute;top:90px;left:180px;width:600px;height:400px;background:var(--panel);border:2px solid var(--line);border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 #e2d6bb}
#res-title{font-size:36px;font-weight:700}
#res-stars{font-size:52px;color:var(--gold);letter-spacing:6px;height:70px;line-height:70px}
#res-stars .off{color:#ddd5c4}
.res-line{display:flex;gap:30px;font-size:22px}
.res-line span{width:220px;text-align:center}
#res-score{font-size:40px;font-weight:700;color:var(--btn)}
#res-new{font-size:20px;color:var(--ng);font-weight:700;height:28px}
#s-result .btn-row{position:absolute;top:516px;left:0;width:960px}

/* ---- records ---- */
#rec-list{position:absolute;top:84px;left:80px;width:800px;display:flex;flex-direction:column;gap:8px}
.rec-row{height:46px;background:var(--panel);border:2px solid var(--line);border-radius:10px;display:flex;align-items:center;font-size:20px;font-weight:700}
.rec-row span{text-align:center}
.rec-row .n{width:300px;text-align:left;padding-left:20px}
.rec-row .st{width:160px;color:var(--gold)}
.rec-row .sc{width:160px}
.rec-row .pl{width:160px;color:var(--sub);font-size:16px}
.rec-row.head{background:transparent;border-color:transparent;color:var(--sub);font-size:16px;height:30px}
#rec-reset{position:absolute;bottom:20px;left:0;width:960px;display:flex;justify-content:center}
#rec-reset button{width:200px;height:48px;font-size:18px}
</style>
</head>
<body>
<div id="viewport"><div id="stage">

<!-- タイトル -->
<section class="screen active" id="s-title">
  <button id="se-btn" class="sec">SE: ON</button>
  <div class="logo"><h1>くらいタワー</h1><p>ブロックを つんで、かずを つくろう</p></div>
  <div id="title-towers"></div>
  <div class="btn-row">
    <button class="big" id="b-start">はじめる</button>
    <button class="mid sec" id="b-records">きろく</button>
  </div>
  <div id="ver">v1.0 / K.nom</div>
</section>

<!-- ステージ選択 -->
<section class="screen" id="s-select">
  <div class="hdr"><button class="back sec" id="b-sel-back">もどる</button><h2>ステージを えらぼう</h2></div>
  <div id="stage-grid"></div>
</section>

<!-- ゲーム -->
<section class="screen" id="s-game">
  <div id="g-hdr">
    <div id="g-stage"></div>
    <div id="g-task"></div>
    <div id="g-timer">90</div>
    <div id="g-score">0てん</div>
  </div>
  <div id="g-prog"></div>
  <div id="g-now"></div>
  <div id="towers"></div>
  <div id="scale-area">
    <div id="scale-info"></div>
    <svg id="scale-svg" viewBox="0 0 900 200"></svg>
    <div id="scale-btns">
      <button id="b-zoom-in">ズームイン</button>
      <button id="b-zoom-out" class="sec">ズームアウト</button>
    </div>
    <div id="scale-hint"></div>
  </div>
  <div id="g-fb"></div>
  <div id="g-btns"></div>
  <div id="g-choices"></div>
</section>

<!-- けっか -->
<section class="screen" id="s-result">
  <div class="hdr"><h2>けっか</h2></div>
  <div id="res-box">
    <div id="res-title"></div>
    <div id="res-stars"></div>
    <div class="res-line"><span id="res-correct"></span><span id="res-miss"></span></div>
    <div class="res-line"><span id="res-time"></span><span id="res-bonus"></span></div>
    <div id="res-score"></div>
    <div id="res-new"></div>
  </div>
  <div class="btn-row">
    <button class="mid" id="b-retry">もういちど</button>
    <button class="mid sec" id="b-to-select">ステージへ</button>
  </div>
</section>

<!-- きろく -->
<section class="screen" id="s-records">
  <div class="hdr"><button class="back sec" id="b-rec-back">もどる</button><h2>きろく</h2></div>
  <div id="rec-list"></div>
  <div id="rec-reset"><button class="sec" id="b-rec-reset">きろくを けす</button></div>
</section>

</div></div>

<script>
/*__SE__*/
</script>
<script>
// ===================== 基本 =====================
const $ = s => document.querySelector(s);
const SAVE_KEY = 'kurai_tower_v1';
let save = { se: true, best: {} };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) { }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }

const SND = { el: {} };
function se(k) {
  if (!save.se || !window.KT_SE || !KT_SE[k]) return;
  try { const a = (SND.el[k] = SND.el[k] || new Audio(KT_SE[k])).cloneNode(); a.volume = 0.6; a.play().catch(() => { }); } catch (e) { }
}

function fitStage() {
  const sc = Math.min(window.innerWidth / 960, window.innerHeight / 600);
  $('#stage').style.transform = 'scale(' + sc + ')';
}
window.addEventListener('resize', fitStage); fitStage();

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#' + id).classList.add('active');
}
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const UNITS = [1, 10, 100, 1000];
const UNAME = { 1: '一', 10: '十', 100: '百', 1000: '千' };

// ===================== ステージ定義 =====================
const STAGES = [
  { id: 't1', grade: '1ねん', name: '20まで', range: '1〜20', type: 'tower', min: 1, max: 20, units: [1], cols: 2, time: 60 },
  { id: 't2', grade: '2ねん', name: '100まで', range: '11〜100', type: 'tower', min: 11, max: 100, units: [1, 10], cols: 3, time: 90 },
  { id: 't3', grade: '2ねん', name: '1000まで', range: '101〜1000', type: 'tower', min: 101, max: 1000, units: [1, 10, 100], cols: 4, time: 120 },
  { id: 't4', grade: '3ねん', name: '1まんまで', range: '1001〜9999', type: 'tower', min: 1001, max: 9999, units: [1, 10, 100, 1000], cols: 4, time: 150 },
  { id: 'm1', grade: '2ねん', name: 'めもり 100', range: '0〜100', type: 'scale', top: 100, prec: [1, 10], time: 90 },
  { id: 'm2', grade: '3ねん', name: 'めもり 1000', range: '0〜1000', type: 'scale', top: 1000, prec: [1, 10, 100], time: 90 },
  { id: 'm3', grade: '3ねん', name: 'めもり 1まん', range: '0〜10000', type: 'scale', top: 10000, prec: [10, 100, 1000], time: 90 },
];
const Q_COUNT = 10;

// ===================== タイトル =====================
function drawTitleTowers() {
  const box = $('#title-towers'); box.innerHTML = '';
  [[1000, 2, 150], [100, 3, 120], [10, 4, 80], [1, 3, 36]].forEach(([u, n, w]) => {
    const c = document.createElement('div'); c.style.display = 'flex'; c.style.flexDirection = 'column-reverse';
    for (let i = 0; i < n; i++) { const b = document.createElement('div'); b.className = 'blk u' + u + ' tb'; b.style.width = w + 'px'; c.appendChild(b); }
    box.appendChild(c);
  });
}
function updateSeBtn() { $('#se-btn').textContent = 'SE: ' + (save.se ? 'ON' : 'OFF'); }
$('#se-btn').onclick = () => { save.se = !save.se; persist(); updateSeBtn(); se('tap'); };
$('#b-start').onclick = () => { se('decide'); renderSelect(); show('s-select'); };
$('#b-records').onclick = () => { se('decide'); renderRecords(); show('s-records'); };
$('#b-sel-back').onclick = () => { se('tap'); show('s-title'); };
$('#b-rec-back').onclick = () => { se('tap'); show('s-title'); };
$('#b-rec-reset').onclick = () => { se('ng'); save.best = {}; persist(); renderRecords(); };
drawTitleTowers(); updateSeBtn();

// ===================== ステージ選択 =====================
function starsText(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }
function renderSelect() {
  const g = $('#stage-grid'); g.innerHTML = '';
  const mk = (label, list) => {
    const l = document.createElement('div'); l.className = 'sec-label'; l.textContent = label; g.appendChild(l);
    const row = document.createElement('div'); row.className = 'grid-row';
    list.forEach(st => {
      const b = save.best[st.id] || { score: 0, stars: 0 };
      const c = document.createElement('div'); c.className = 'card';
      c.innerHTML = `<div class="grade">${st.grade}</div><div class="name">${st.name}</div><div class="range">${st.range}</div>
        <div class="stars">${b.stars ? starsText(b.stars) : ''}</div><div class="best">ベスト ${b.score}てん</div>`;
      c.onclick = () => { se('decide'); startGame(st); };
      row.appendChild(c);
    });
    g.appendChild(row);
  };
  mk('タワーモード：ブロックを つんで かずを つくる', STAGES.filter(s => s.type === 'tower'));
  mk('めもりモード：すうちょくせんを よむ', STAGES.filter(s => s.type === 'scale'));
}

// ===================== ゲーム共通 =====================
let G = null, timerId = null;
function startGame(st) {
  G = { st, qi: 0, correct: 0, miss: 0, score: 0, time: st.time, lock: false, questions: makeQuestions(st) };
  $('#g-stage').textContent = st.grade + ' ' + st.name;
  $('#g-score').textContent = '0てん';
  $('#g-timer').textContent = st.time; $('#g-timer').classList.remove('warn');
  show('s-game');
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (!G || G.ended) return;
    G.time--; $('#g-timer').textContent = G.time;
    if (G.time <= 10) $('#g-timer').classList.add('warn');
    if (G.time <= 0) endGame();
  }, 1000);
  nextQuestion();
}
function makeQuestions(st) {
  const qs = [];
  if (st.type === 'tower') {
    const used = new Set();
    for (let i = 0; i < Q_COUNT; i++) {
      let n; do { n = rnd(st.min, st.max); } while (used.has(n)); used.add(n);
      // 7問つくる / 3問よむ
      qs.push({ kind: (i % 10 === 3 || i % 10 === 6 || i % 10 === 9) ? 'read' : 'build', n });
    }
  } else {
    for (let i = 0; i < Q_COUNT; i++) {
      // 前半はあらい目盛り、後半は細かい目盛り
      const p = st.prec[st.prec.length - 1 - Math.min(st.prec.length - 1, Math.floor(i / Math.ceil(Q_COUNT / st.prec.length)))];
      let n; do { n = rnd(1, st.top / p - 1) * p; } while (n % (p * 10) === 0 && p * 10 < st.top && Math.random() < 0.7);
      qs.push({ kind: 'scale', n, prec: p });
    }
  }
  return qs;
}
function nextQuestion() {
  if (G.qi >= Q_COUNT) return endGame();
  G.q = G.questions[G.qi]; G.lock = false;
  $('#g-prog').textContent = `もんだい ${G.qi + 1} / ${Q_COUNT}`;
  $('#g-fb').className = '';
  if (G.q.kind === 'build') setupBuild();
  else if (G.q.kind === 'read') setupRead();
  else setupScale();
}
function feedback(ok) {
  const f = $('#g-fb'); f.textContent = ok ? 'せいかい！' : 'ちがうよ'; f.className = ok ? 'ok' : 'ng';
  se(ok ? 'ok' : 'ng');
  if (!ok) { const t = $('#towers'); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); }
}
function addScore(n) { G.score += n; $('#g-score').textContent = G.score + 'てん'; }
function endGame() {
  clearInterval(timerId); G.ended = true; G.lock = true;
  const bonus = G.qi >= Q_COUNT ? Math.max(0, G.time) * 2 : 0; const total = G.score + bonus;
  const stars = G.correct >= 10 && G.miss === 0 ? 3 : G.correct >= 8 ? 2 : G.correct >= 5 ? 1 : 0;
  const prev = save.best[G.st.id] || { score: 0, stars: 0 };
  const isNew = total > prev.score;
  save.best[G.st.id] = { score: Math.max(prev.score, total), stars: Math.max(prev.stars, stars), plays: (prev.plays || 0) + 1 };
  persist();
  $('#res-title').textContent = G.st.grade + ' ' + G.st.name;
  $('#res-stars').innerHTML = '★'.repeat(stars) + '<span class="off">' + '★'.repeat(3 - stars) + '</span>';
  $('#res-correct').textContent = `せいかい ${G.correct} / ${Q_COUNT}`;
  $('#res-miss').textContent = `まちがい ${G.miss}`;
  $('#res-time').textContent = `のこり ${Math.max(0, G.time)}びょう`;
  $('#res-bonus').textContent = `ボーナス +${bonus}`;
  $('#res-score').textContent = total + 'てん';
  $('#res-new').textContent = isNew && total > 0 ? 'しんきろく！' : '';
  se(stars >= 2 ? 'cheer' : 'good');
  show('s-result');
}
$('#b-retry').onclick = () => { se('decide'); startGame(G.st); };
$('#b-to-select').onclick = () => { se('tap'); renderSelect(); show('s-select'); };

// ===================== タワーモード =====================
function digitsOf(n, cols) { const d = []; for (let i = 0; i < cols; i++) d.push(Math.floor(n / UNITS[i]) % 10); return d; }
function renderTowers(n, cols, opts = {}) {
  const box = $('#towers'); box.innerHTML = ''; box.style.display = 'flex'; $('#scale-area').style.display = 'none';
  const d = opts.override || digitsOf(n, cols);
  for (let i = cols - 1; i >= 0; i--) {
    const u = UNITS[i];
    const col = document.createElement('div'); col.className = 'col'; col.dataset.u = u;
    if (opts.bundle && opts.bundle.includes(u)) col.classList.add('bundle');
    const digit = document.createElement('div'); digit.className = 'digit'; digit.textContent = opts.hideDigits ? '?' : (opts.digits ? opts.digits[i] : d[i]);
    const stack = document.createElement('div'); stack.className = 'stack';
    for (let k = 0; k < d[i]; k++) {
      const b = document.createElement('div'); b.className = 'blk u' + u;
      if (opts.pop && opts.pop.includes(u) && k === d[i] - 1) b.classList.add('pop');
      stack.appendChild(b);
    }
    const label = document.createElement('div'); label.className = 'label'; label.textContent = UNAME[u] + 'のくらい';
    col.appendChild(digit); col.appendChild(stack); col.appendChild(label);
    box.appendChild(col);
  }
}
function setupBuild() {
  G.cur = 0; G.undo = [];
  $('#g-task').innerHTML = `<b>${G.q.n}</b> を つくろう`;
  $('#g-now').textContent = 'いま 0';
  $('#g-choices').style.display = 'none';
  const bb = $('#g-btns'); bb.style.display = 'flex'; bb.innerHTML = '';
  [...G.st.units].reverse().forEach(u => {
    const b = document.createElement('button'); b.className = 'u' + u; b.textContent = u + 'を つむ';
    b.onclick = () => addBlock(u); bb.appendChild(b);
  });
  const un = document.createElement('button'); un.className = 'sec'; un.textContent = '1つ もどす'; un.onclick = undoBlock; bb.appendChild(un);
  const cl = document.createElement('button'); cl.className = 'sec'; cl.textContent = 'ぜんぶ けす'; cl.onclick = clearBlocks; bb.appendChild(cl);
  const dn = document.createElement('button'); dn.className = 'done'; dn.textContent = 'できた！'; dn.onclick = checkBuild; bb.appendChild(dn);
  renderTowers(0, G.st.cols);
}
const MAXV = { 2: 99, 3: 999, 4: 9999 };
function addBlock(u) {
  if (G.lock) return;
  const next = G.cur + u;
  if (next > MAXV[G.st.cols]) { se('ng'); return; }
  const before = digitsOf(G.cur, G.st.cols), after = digitsOf(next, G.st.cols);
  G.undo.push(u); G.cur = next; se('tap');
  // くり上がり検出：u の桁から上へ、9→0 になった桁
  const carried = []; let i = UNITS.indexOf(u);
  while (i < G.st.cols && before[i] === 9 && after[i] === 0) { carried.push(UNITS[i]); i++; }
  if (carried.length) {
    G.lock = true;
    const over = before.slice(); over[UNITS.indexOf(u)] += 1; // 10個そろった状態を見せる
    for (let k = 0; k < carried.length; k++) { const idx = UNITS.indexOf(carried[k]); over[idx] = 10; if (idx + 1 < G.st.cols && k === carried.length - 1) { /* 次の桁は後で */ } }
    renderTowers(G.cur, G.st.cols, { override: over, digits: over, bundle: carried });
    se('good');
    setTimeout(() => { renderTowers(G.cur, G.st.cols, { pop: [UNITS[i] || 0] }); $('#g-now').textContent = 'いま ' + G.cur; if (!G.ended) G.lock = false; }, 420);
  } else {
    renderTowers(G.cur, G.st.cols, { pop: [u] });
  }
  $('#g-now').textContent = 'いま ' + G.cur;
}
function undoBlock() {
  if (G.lock || !G.undo.length) return;
  G.cur -= G.undo.pop(); se('tap');
  renderTowers(G.cur, G.st.cols); $('#g-now').textContent = 'いま ' + G.cur;
}
function clearBlocks() {
  if (G.lock) return; G.cur = 0; G.undo = []; se('tap');
  renderTowers(0, G.st.cols); $('#g-now').textContent = 'いま 0';
}
function checkBuild() {
  if (G.lock) return;
  if (G.cur === G.q.n) {
    G.lock = true; G.correct++; addScore(100); feedback(true);
    setTimeout(() => { G.qi++; nextQuestion(); }, 900);
  } else { G.miss++; feedback(false); setTimeout(() => { if ($('#g-fb').classList.contains('ng')) $('#g-fb').className = ''; }, 900); }
}
function setupRead() {
  $('#g-task').innerHTML = 'この かずは <b>?</b>';
  $('#g-now').textContent = '';
  $('#g-btns').style.display = 'none';
  renderTowers(G.q.n, G.st.cols, { hideDigits: true });
  const n = G.q.n, cols = G.st.cols, cand = new Set([n]);
  const d = digitsOf(n, cols);
  const tries = [];
  // 桁の入れかえ
  for (let i = 0; i < cols - 1; i++) { const e = d.slice(); [e[i], e[i + 1]] = [e[i + 1], e[i]]; tries.push(e.reduce((s, v, k) => s + v * UNITS[k], 0)); }
  // ±1, ±10, ±100
  UNITS.slice(0, cols).forEach(u => { tries.push(n + u, n - u); });
  shuffle(tries).forEach(v => { if (cand.size < 4 && v > 0 && v <= MAXV[cols] && v !== n) cand.add(v); });
  while (cand.size < 4) cand.add(rnd(G.st.min, G.st.max));
  showChoices(shuffle([...cand]), n, () => { renderTowers(n, cols); });
}
function showChoices(list, answer, onReveal) {
  const c = $('#g-choices'); c.style.display = 'flex'; c.innerHTML = '';
  list.forEach(v => {
    const b = document.createElement('button'); b.textContent = v;
    b.onclick = () => {
      if (G.lock) return;
      if (v === answer) {
        G.lock = true; G.correct++; addScore(100); feedback(true); b.classList.add('right'); if (onReveal) onReveal();
        setTimeout(() => { G.qi++; nextQuestion(); }, 900);
      } else { G.miss++; feedback(false); b.classList.add('wrong'); b.disabled = true; setTimeout(() => { $('#g-fb').className = ''; }, 900); }
    };
    c.appendChild(b);
  });
}

// ===================== めもりモード =====================
function setupScale() {
  $('#g-task').innerHTML = 'やじるしの かずは <b>?</b>';
  $('#g-now').textContent = '';
  $('#g-btns').style.display = 'none'; $('#towers').style.display = 'none';
  $('#scale-area').style.display = 'flex';
  G.zoom = 0; // 0 = いちばん広い
  G.levels = []; let step = G.st.top / 10;
  while (step >= G.q.prec && step >= 1) { G.levels.push(step); step /= 10; }
  renderScale();
  const n = G.q.n, p = G.q.prec, cand = new Set([n]);
  const tries = [n + p, n - p, n + p * 10, n - p * 10, n * 10, Math.round(n / 10 / p) * p];
  shuffle(tries).forEach(v => { if (cand.size < 4 && v > 0 && v < G.st.top && v !== n) cand.add(v); });
  while (cand.size < 4) cand.add(rnd(1, G.st.top / p - 1) * p);
  showChoices(shuffle([...cand]), n, null);
}
function scaleRange() {
  const step = G.levels[G.zoom]; const span = step * 10;
  const lo = Math.floor(G.q.n / span) * span;
  return { lo, hi: lo + span, step };
}
function renderScale() {
  const { lo, hi, step } = scaleRange();
  $('#scale-info').textContent = `1めもり = ${step}`;
  $('#scale-hint').textContent = G.zoom < G.levels.length - 1 ? 'よみにくいときは ズームイン' : 'いちばん こまかい めもり';
  $('#b-zoom-in').disabled = G.zoom >= G.levels.length - 1;
  $('#b-zoom-out').disabled = G.zoom <= 0;
  const x0 = 60, x1 = 840, y = 120;
  const px = v => x0 + (v - lo) / (hi - lo) * (x1 - x0);
  let s = `<line x1="${x0 - 20}" y1="${y}" x2="${x1 + 20}" y2="${y}" stroke="#3a3530" stroke-width="4"/>`;
  for (let i = 0; i <= 10; i++) {
    const v = lo + step * i, x = px(v), big = (i % 5 === 0);
    s += `<line x1="${x}" y1="${y - (big ? 26 : 14)}" x2="${x}" y2="${y}" stroke="#3a3530" stroke-width="${big ? 4 : 3}"/>`;
    if (big) s += `<text x="${x}" y="${y + 36}" font-size="20" font-weight="700" text-anchor="middle" fill="#3a3530">${v}</text>`;
  }
  const ax = px(G.q.n);
  s += `<polygon points="${ax},${y - 40} ${ax - 14},${y - 68} ${ax + 14},${y - 68}" fill="#e05a5a"/>`;
  s += `<rect x="${ax - 6}" y="${y - 96}" width="12" height="30" fill="#e05a5a" rx="3"/>`;
  $('#scale-svg').innerHTML = s;
}
$('#b-zoom-in').onclick = () => { if (G.zoom < G.levels.length - 1) { G.zoom++; se('tap'); renderScale(); } };
$('#b-zoom-out').onclick = () => { if (G.zoom > 0) { G.zoom--; se('tap'); renderScale(); } };

// ===================== きろく =====================
function renderRecords() {
  const l = $('#rec-list'); l.innerHTML = '';
  const h = document.createElement('div'); h.className = 'rec-row head';
  h.innerHTML = '<span class="n">ステージ</span><span class="st">ほし</span><span class="sc">ベスト</span><span class="pl">プレイ</span>'; l.appendChild(h);
  STAGES.forEach(st => {
    const b = save.best[st.id] || { score: 0, stars: 0, plays: 0 };
    const r = document.createElement('div'); r.className = 'rec-row';
    r.innerHTML = `<span class="n">${st.grade} ${st.name}</span><span class="st">${b.stars ? starsText(b.stars) : '－'}</span><span class="sc">${b.score}てん</span><span class="pl">${b.plays || 0}かい</span>`;
    l.appendChild(r);
  });
}
